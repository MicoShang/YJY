<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yujia Yang  —  Owner's Manual 使用手册</title>
<meta name="description" content="The official Yujia Yang user manual — background info, preferences, meal guide and troubleshooting FAQ.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f4f1">
<link rel="icon" type="image/jpeg" href="assets/doc-yang-avatar-256.jpg">
</head>
<body>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:400 900;font-display:swap;src:url("assets/fonts/archivo-latin.woff2") format('woff2');}
@font-face{font-family:'Caveat';font-style:normal;font-weight:400 700;font-display:swap;src:url("assets/fonts/caveat-latin.woff2") format('woff2');}

  #yy-manual-root{
    --paper:#f6f4f1;
    --ink:#1a1714;
    --ink-soft:#4a443e;
    --muted:#6e665f;
    --faint:#655d57;
    --line:rgba(26,23,20,.13);
    --accent:#bd3d59;
    --media:#efebe5;
    --avatar:url("assets/doc-yang-avatar-256.jpg");
    --f-display:'Archivo',"PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    position:relative;
    display:block;
    width:100%;
    box-sizing:border-box;
    padding:clamp(18px,2.6vw,30px) clamp(20px,5vw,48px) clamp(40px,6vw,64px);
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-display);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  #yy-manual-root *,#yy-manual-root *::before,#yy-manual-root *::after{box-sizing:border-box;}
  #yy-manual-root ::selection{background:rgba(189,61,89,.18);}
  #yy-manual-root a,#yy-manual-root button{-webkit-tap-highlight-color:transparent;}
  #yy-manual-root a:focus-visible,
  #yy-manual-root button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px;}
  @supports (scrollbar-width:thin){html{scrollbar-width:thin;scrollbar-color:#cfc6bc transparent;}}

  #yy-manual-root .yy-page{max-width:984px;margin:0 auto;}

  /* ---------- top bar ---------- */
  #yy-manual-root .yy-top{
    display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:56px;
  }
  #yy-manual-root .yy-avatar{
    width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    background-color:#f1ede8;
    background-image:var(--avatar);
    background-size:cover;background-position:50% 20%;background-repeat:no-repeat;
    box-shadow:inset 0 0 0 1px rgba(26,23,20,.10);
  }
  #yy-manual-root .yy-lang{
    display:flex;align-items:center;gap:.15em;
    font-size:.82rem;font-weight:700;letter-spacing:.06em;color:var(--muted);
  }
  #yy-manual-root .yy-lang button{
    position:relative;appearance:none;background:none;border:0;min-width:44px;min-height:44px;padding:0 10px;
    display:inline-flex;align-items:center;justify-content:center;
    font:inherit;font-weight:700;color:var(--muted);cursor:pointer;
    transition:color .25s ease;
  }
  #yy-manual-root .yy-lang button::after{
    content:"";position:absolute;left:50%;bottom:9px;width:16px;height:1px;
    background:transparent;transform:translateX(-50%);transition:background-color .25s ease;
  }
  #yy-manual-root .yy-lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #yy-manual-root .yy-lang button:hover{color:var(--ink);}
  #yy-manual-root .yy-lang button.is-active{color:var(--ink);}
  #yy-manual-root .yy-lang button.is-active::after{background:var(--ink);}
  #yy-manual-root .yy-lang .yy-sep{color:rgba(26,23,20,.22);font-weight:400;}

  /* ---------- masthead ---------- */
  #yy-manual-root .yy-hero{margin-top:clamp(36px,6vw,72px);text-align:center;}
  #yy-manual-root .yy-name{
    margin:0;
    font-weight:900;
    letter-spacing:-.035em;
    line-height:.9;
    font-size:clamp(2.9rem,10vw,7.5rem);
    text-wrap:balance;
  }
  /* Yujia solid, Yang set back in semi-transparent ink — one masthead, two depths */
  #yy-manual-root .yy-name .yy-a{color:var(--accent);}
  #yy-manual-root .yy-name .yy-b{color:rgba(26,23,20,.62);}
  #yy-manual-root .yy-lede{
    margin:clamp(16px,2.2vw,24px) 0 0;
    font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
  }
  #yy-manual-root .yy-lede .yy-dot{margin:0 .55em;color:rgba(26,23,20,.26);}
  #yy-manual-root .yy-lede .yy-zh{letter-spacing:.1em;}

  /* ---------- the card fan ---------- */
  #yy-manual-root .yy-stage{
    margin-top:clamp(18px,3vw,40px);
    display:flex;justify-content:center;
  }
  #yy-manual-root .yy-fan{
    display:flex;align-items:center;justify-content:center;
    padding:26px 0 10px;
  }
  #yy-manual-root .yy-card{
    --w:clamp(150px,19.5vw,236px);
    position:relative;
    flex:0 0 auto;
    width:var(--w);
    margin-left:clamp(-44px,-3vw,-20px);
    z-index:var(--z,1);
    transform:translate3d(var(--px,0px),var(--py,0px),0) rotate(var(--pr,0deg));
    will-change:transform;
    transition:transform .7s cubic-bezier(.16,1,.3,1);
  }
  #yy-manual-root .yy-card:first-child{margin-left:0;}
  #yy-manual-root .yy-card:hover,
  #yy-manual-root .yy-card:focus-within{z-index:9;}

  #yy-manual-root .yy-card-in{
    display:block;position:relative;width:100%;aspect-ratio:4/5;
    border-radius:16px;overflow:hidden;
    background:var(--media);
    border:1px solid var(--line);
    text-decoration:none;color:inherit;
    box-shadow:0 30px 48px -34px rgba(26,23,20,.62), 0 3px 8px -4px rgba(26,23,20,.14);
    transform:translateY(var(--y,0px)) rotate(var(--r,0deg));
    transition:transform .6s cubic-bezier(.16,1,.3,1),
               box-shadow .6s cubic-bezier(.16,1,.3,1),
               border-color .6s cubic-bezier(.16,1,.3,1);
  }
  #yy-manual-root .yy-card:hover .yy-card-in,
  #yy-manual-root .yy-card:focus-within .yy-card-in{
    transform:translateY(calc(var(--y,0px) - 18px)) rotate(0deg) scale(1.05);
    border-color:rgba(189,61,89,.42);
    box-shadow:0 44px 64px -34px rgba(26,23,20,.7), 0 5px 12px -5px rgba(26,23,20,.18);
  }
  /* keeps captions readable once real photos land in the media slot */
  #yy-manual-root .yy-card-in::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:46%;
    background:linear-gradient(to top,rgba(246,244,241,.72),rgba(246,244,241,0));
    pointer-events:none;
  }
  #yy-manual-root .yy-card-num{
    position:absolute;top:14px;left:16px;z-index:2;
    font-size:.7rem;font-weight:800;letter-spacing:.16em;color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  #yy-manual-root .yy-card-media{position:absolute;inset:0;display:grid;place-items:center;}
  #yy-manual-root .yy-card-media svg{width:24px;height:24px;color:#b3aaa1;stroke-width:1.5;}
  #yy-manual-root .yy-card-media img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:50% 50%;display:block;
  }
  /* dark artwork: invert the caption to stay legible */
  #yy-manual-root .yy-card.is-dark .yy-card-in::after{
    background:linear-gradient(to top,rgba(16,13,11,.82),rgba(16,13,11,0));
  }
  #yy-manual-root .yy-card.is-dark .yy-card-en{color:#fff;}
  #yy-manual-root .yy-card.is-dark .yy-card-zh{color:rgba(255,255,255,.84);}
  #yy-manual-root .yy-card.is-dark .yy-card-num{color:rgba(255,255,255,.7);}
  #yy-manual-root .yy-card-go{
    position:absolute;top:12px;right:12px;z-index:2;
    display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
    background:var(--paper);color:var(--ink);
    opacity:0;transform:translateY(-5px);
    transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
  }
  #yy-manual-root .yy-card-go svg{width:13px;height:13px;color:currentColor;stroke-width:2;}
  #yy-manual-root .yy-card-text{
    position:absolute;left:16px;bottom:15px;width:70%;z-index:2;
  }
  #yy-manual-root .yy-card-en{
    display:block;font-size:.9rem;font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--ink);
  }
  #yy-manual-root .yy-card-zh{
    display:block;margin-top:.22em;font-size:.75rem;font-weight:500;letter-spacing:.02em;color:var(--muted);
  }
  #yy-manual-root .yy-card:hover .yy-card-go,
  #yy-manual-root .yy-card:focus-within .yy-card-go{opacity:1;transform:none;}

  /* language emphasis swap */
  #yy-manual-root.lang-zh .yy-card-en{font-size:.75rem;font-weight:500;letter-spacing:.02em;color:var(--muted);}
  #yy-manual-root.lang-zh .yy-card-zh{font-size:.9rem;font-weight:800;letter-spacing:-.015em;color:var(--ink);}

  /* ---------- footer ---------- */
  #yy-manual-root .yy-end{
    margin-top:clamp(44px,7vw,80px);
    padding-top:26px;
    border-top:1px solid var(--line);
  }
  #yy-manual-root .yy-sign-title{
    margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:.45em;
    font-size:1rem;font-weight:800;letter-spacing:-.01em;color:var(--ink);
  }
  #yy-manual-root .yy-sign-sep{color:var(--accent);font-weight:700;}
  #yy-manual-root .yy-sign-ver{color:var(--muted);font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums;}
  #yy-manual-root .yy-sign-sub{
    margin:.55em 0 0;max-width:60ch;
    font-size:.82rem;line-height:1.75;color:var(--muted);
  }

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    #yy-manual-root .yy-card{--w:clamp(138px,20vw,200px);margin-left:clamp(-38px,-2.6vw,-16px);}
  }
  #yy-manual-root .yy-lede .yy-zh{white-space:nowrap;}

  @media (max-width:640px){
    #yy-manual-root .yy-fan{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;width:100%;padding:18px 0 0;
    }
    #yy-manual-root .yy-card{width:100%;margin-left:0;transform:none;}
    #yy-manual-root .yy-card-in{transform:rotate(calc(var(--r,0deg) * .45));}
    #yy-manual-root .yy-card:hover .yy-card-in,
    #yy-manual-root .yy-card:focus-within .yy-card-in{transform:rotate(0deg) scale(1.02);}
    #yy-manual-root .yy-card-text{left:16px;right:16px;width:auto;}
  }

  @media (max-width:360px){
    #yy-manual-root .yy-card-text{left:12px;right:12px;bottom:12px;}
    #yy-manual-root .yy-card-en{font-size:.75rem;}
    #yy-manual-root .yy-card:nth-child(4) .yy-card-en{font-size:.64rem;letter-spacing:-.015em;}
    #yy-manual-root .yy-card-zh{font-size:.68rem;}
  }
  @media (prefers-reduced-motion:no-preference){
    #yy-manual-root .yy-name,
    #yy-manual-root .yy-lede,
    #yy-manual-root .yy-end{animation:yy-rise .9s cubic-bezier(.16,1,.3,1) both;}
    #yy-manual-root .yy-lede{animation-delay:.05s;}
    #yy-manual-root .yy-end{animation-delay:.34s;}
    #yy-manual-root .yy-card{animation:yy-enter .75s cubic-bezier(.16,1,.3,1) both;}
    #yy-manual-root .yy-card:nth-child(1){animation-delay:.10s;}
    #yy-manual-root .yy-card:nth-child(2){animation-delay:.16s;}
    #yy-manual-root .yy-card:nth-child(3){animation-delay:.22s;}
    #yy-manual-root .yy-card:nth-child(4){animation-delay:.28s;}
  }
  @keyframes yy-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes yy-enter{from{opacity:0;scale:.92;}to{opacity:1;scale:1;}}
</style>

<div id="yy-manual-root" class="yy-root" data-lang="en" role="group" aria-label="Yujia Yang owner's manual homepage">
  <div class="yy-page">

    <header class="yy-top">
      <div class="yy-avatar" role="img" aria-label="Doc. Yang avatar"></div>
      <div class="yy-lang" role="group" aria-label="Language / 语言">
        <button type="button" data-yy-lang="en" class="is-active" aria-pressed="true">EN</button>
        <span class="yy-sep">/</span>
        <button type="button" data-yy-lang="zh" aria-pressed="false">中文</button>
      </div>
    </header>

    <main>
      <section class="yy-hero">
        <h1 class="yy-name"><span class="yy-a">Yujia</span> <span class="yy-b">Yang</span></h1>
        <p class="yy-lede">Owner&rsquo;s Manual<span class="yy-dot">·</span>2026<span class="yy-dot">·</span><span class="yy-zh">官方使用手册</span></p>
      </section>

      <div class="yy-stage">
        <nav class="yy-fan" aria-label="Chapters">
          <div class="yy-card" style="--r:-10deg;--y:20px;--z:1" data-dx="1.35" data-dy="0.6" data-dr="1.4">
            <a class="yy-card-in" href="background-info.html">
              <span class="yy-card-num">01</span>
              <span class="yy-card-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
              <span class="yy-card-media"><img src="assets/card-background-info.jpg" alt=""></span>
              <span class="yy-card-text">
                <span class="yy-card-en">Background Info.</span>
                <span class="yy-card-zh">背景信息</span>
              </span>
            </a>
          </div>
          <div class="yy-card is-dark" style="--r:-3.5deg;--y:0px;--z:2" data-dx="0.75" data-dy="1" data-dr="0.5">
            <a class="yy-card-in" href="preferences.html">
              <span class="yy-card-num">02</span>
              <span class="yy-card-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
              <span class="yy-card-media"><img src="assets/card-meal-guide.jpg" alt=""></span>
              <span class="yy-card-text">
                <span class="yy-card-en">Preferences</span>
                <span class="yy-card-zh">偏好设置</span>
              </span>
            </a>
          </div>
          <div class="yy-card is-dark" style="--r:3.5deg;--y:0px;--z:3" data-dx="0.75" data-dy="1" data-dr="-0.5">
            <a class="yy-card-in" href="meal-guide.html">
              <span class="yy-card-num">03</span>
              <span class="yy-card-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
              <span class="yy-card-media"><img src="assets/card-preferences.jpg" alt=""></span>
              <span class="yy-card-text">
                <span class="yy-card-en">Meal Guide</span>
                <span class="yy-card-zh">恰饭指南</span>
              </span>
            </a>
          </div>
          <div class="yy-card" style="--r:10deg;--y:20px;--z:4" data-dx="1.35" data-dy="0.6" data-dr="-1.4">
            <a class="yy-card-in" href="faq.html">
              <span class="yy-card-num">04</span>
              <span class="yy-card-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
              <span class="yy-card-media"><img src="assets/card-faq.jpg" alt=""></span>
              <span class="yy-card-text">
                <span class="yy-card-en">Troubleshooting FAQ</span>
                <span class="yy-card-zh">故障排除</span>
              </span>
            </a>
          </div>
        </nav>
      </div>

      <footer class="yy-end">
        <p class="yy-sign-title">Yujia.Y 个人使用说明书<span class="yy-sign-sep">｜</span><span class="yy-sign-ver">V1.0</span></p>
        <p class="yy-sign-sub">这份手册用于快速了解 Dr. YJ.Y。记录偏好，减少误会，友好相处。</p>
      </footer>
    </main>
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById('yy-manual-root');
    if (!root) return;

    var buttons = root.querySelectorAll('[data-yy-lang]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () {
        var lang = this.getAttribute('data-yy-lang');
        root.classList.toggle('lang-zh', lang === 'zh');
        root.setAttribute('data-lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        for (var j = 0; j < buttons.length; j++) {
          var active = buttons[j] === this;
          buttons[j].classList.toggle('is-active', active);
          buttons[j].setAttribute('aria-pressed', active ? 'true' : 'false');
        }
      });
    }

    var mqReduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    var mqFine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)');
    var fan = root.querySelector('.yy-fan');
    var cards = root.querySelectorAll('.yy-card');

    if (fan && cards.length && !(mqReduce && mqReduce.matches) && !(mqFine && !mqFine.matches)) {
      var deps = [];
      for (var k = 0; k < cards.length; k++) {
        deps.push({
          el: cards[k],
          dx: parseFloat(cards[k].getAttribute('data-dx')) || 1,
          dy: parseFloat(cards[k].getAttribute('data-dy')) || 1,
          dr: parseFloat(cards[k].getAttribute('data-dr')) || 0
        });
      }
      var reset = function () {
        for (var n = 0; n < deps.length; n++) {
          deps[n].el.style.setProperty('--px', '0px');
          deps[n].el.style.setProperty('--py', '0px');
          deps[n].el.style.setProperty('--pr', '0deg');
        }
      };

      window.addEventListener('pointermove', function (e) {
        var r = fan.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var nx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
        var ny = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
        nx = Math.max(-1.3, Math.min(1.3, nx));
        ny = Math.max(-1.3, Math.min(1.3, ny));
        for (var n = 0; n < deps.length; n++) {
          var d = deps[n];
          d.el.style.setProperty('--px', (nx * d.dx * 16).toFixed(2) + 'px');
          d.el.style.setProperty('--py', (ny * d.dy * 12).toFixed(2) + 'px');
          d.el.style.setProperty('--pr', (nx * d.dr).toFixed(3) + 'deg');
        }
      }, { passive: true });

      window.addEventListener('blur', reset);
      document.addEventListener('pointerleave', reset);
      document.addEventListener('mouseleave', reset);
    }

    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons({ attrs: { width: 18, height: 18 } });
    }
  })();
</script>

</body>
</html>
